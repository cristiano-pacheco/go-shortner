<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">27,179 redirects per second. Two Go servers with a combined 64 MiB memory limit.</title>
<desc id="desc">Historical k6 benchmarks with one million links. The mixed scenario reached 7,080 requests per second. Both highlighted runs had zero HTTP errors. Separate closed-loop runs. Dependencies use additional resources.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e31"/><stop offset="1" stop-color="#071019"/></linearGradient><linearGradient id="accent"><stop stop-color="#41e2b0"/><stop offset="1" stop-color="#6bcfff"/></linearGradient></defs>
<rect width="1200" height="480" rx="20" fill="url(#bg)"/>
<path d="M890 0v480M990 0v480M1090 0v480M0 100h1200M0 200h1200M0 300h1200M0 400h1200" stroke="#b5d8ef" stroke-opacity=".035"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="44" y="34" width="5" height="22" rx="2" fill="#41e2b0"/>
<text x="62" y="51" fill="#b8cadb" font-size="15" letter-spacing="2">GO SHORTENER / PERFORMANCE</text>
<rect x="935" y="32" width="220" height="30" rx="15" fill="#132d31"/>
<text x="1045" y="52" fill="#7ce8c5" font-size="12" text-anchor="middle" letter-spacing="1">REPRODUCIBLE WITH K6</text>
<text x="44" y="148" fill="#f1f7fc" font-size="76" font-weight="700" letter-spacing="-3">27,179 <tspan fill="#6be7bf" font-size="54" letter-spacing="-2">redirects/s.</tspan></text>
<text x="47" y="198" fill="#d1dfea" font-size="27">Two Go servers. <tspan fill="#ffffff" font-weight="700">64 MiB</tspan> combined memory limit.</text>
<text x="47" y="234" fill="#91a7bc" font-size="17">Go + PostgreSQL + Redis. Real HTTP requests through Nginx.</text>
<g fill="#122234" stroke="#253b50"><rect x="44" y="275" width="355" height="119" rx="12"/><rect x="420" y="275" width="355" height="119" rx="12"/><rect x="796" y="275" width="360" height="119" rx="12"/></g>
<text x="67" y="325" fill="#f2f8fd" font-size="38" font-weight="700">7,080 <tspan fill="#9bb1c7" font-size="17" font-weight="400">requests/s</tspan></text>
<text x="67" y="367" fill="#9bb1c7" font-size="16">Mixed CRUD + redirects</text>
<text x="443" y="325" fill="#f2f8fd" font-size="38" font-weight="700">1,000,000</text>
<text x="443" y="367" fill="#9bb1c7" font-size="16">Visible links in PostgreSQL</text>
<text x="819" y="325" fill="#6be7bf" font-size="38" font-weight="700">0% <tspan fill="#9bb1c7" font-size="17" font-weight="400">HTTP errors</tspan></text>
<text x="819" y="367" fill="#9bb1c7" font-size="16">In both highlighted runs</text>
<text x="46" y="431" fill="#91a7bc" font-size="13">Separate closed-loop runs. Redirects: 50 VUs / 60s. Mixed: 10 VUs / 2m. Measured 2026-11-05.</text>
<text x="46" y="454" fill="#91a7bc" font-size="13">64 MiB covers Go containers only. Database, cache, proxy, generator and monitoring use additional resources.</text>
</g></svg>