app:
  open-telemetry:
    app_name: go-shortner
    app_version: "1.0.0"
    trace_enabled: true
    trace_url: tempo:4317
    exporter_type: grpc
    insecure: true
    sample_rate: 1.0
    batch_timeout: 2s
    max_batch_size: 512
    max_queue_size: 2048
    export_timeout: 3s
    shutdown_timeout: 5s
  metrics:
    enabled: true
    address: "0.0.0.0"
    port: 9090
  database_host: "env://DATABASE_HOST"
  database_port: "env://DATABASE_PORT"
  database_name: "env://DATABASE_NAME"
  database_user: "env://DATABASE_USER"
  database_password: "env://DATABASE_PASSWORD"
  database_sslmode: "env://DATABASE_SSLMODE"
  redis_url: "env://REDIS_URL"
  api_key: "env://API_KEY"
  public_base_url: "env://PUBLIC_BASE_URL"
  http_addr: "env://HTTP_ADDR"
