app:
  open-telemetry:
    app_name: go-shortner
    app_version: "1.0.0"
    trace_enabled: true
    trace_url: tempo:4317
    exporter_type: grpc
    insecure: true
    sample_rate: 1.0
    batch_timeout: 2s
    max_batch_size: 512
    max_queue_size: 2048
    export_timeout: 3s
    shutdown_timeout: 5s
  metrics:
    enabled: true
    address: "0.0.0.0"
    port: 9090
  database:
    host: "env://DATABASE_HOST"
    port: "env://DATABASE_PORT"
    name: "env://DATABASE_NAME"
    user: "env://DATABASE_USER"
    password: "env://DATABASE_PASSWORD"
    sslmode: "env://DATABASE_SSLMODE"
    maxopenconnections: 30
    maxidleconnections: 10
    connecttimeout: 3
    statementtimeout: 5000
    timezone: UTC
  redis:
    type: single_node
    url: "env://REDIS_URL"
    db: 0
    password: "env://REDIS_PASSWORD"
    dialtimeout: 1s
    readtimeout: 1s
    writetimeout: 1s
    pooltimeout: 1s
    maxretries: 1
    contexttimeoutenabled: true
  http:
    address: "env://HTTP_ADDR"
    port: 8080
    enablemetrics: false
    readtimeout: 15s
    writetimeout: 15s
    idletimeout: 60s
    shutdowntimeout: 20s
  api_key: "env://API_KEY"
  public_base_url: "env://PUBLIC_BASE_URL"
